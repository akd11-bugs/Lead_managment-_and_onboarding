name: Sync leads from Google Sheet

on:
  schedule:
    # Every 15 minutes. GitHub's scheduler can slip by several minutes under
    # load and pauses after 60 days of repo inactivity — fine for a lead
    # sheet, not suitable if sub-minute freshness is ever needed.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call the sync endpoint
        run: |
          status=$(curl -sS -o /tmp/response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SYNC_API_KEY }}" \
            "${{ secrets.APP_URL }}/api/cron/sync-leads-sheet")
          echo "HTTP status: $status"
          cat /tmp/response.json
          if [ "$status" -ge 400 ]; then
            exit 1
          fi
